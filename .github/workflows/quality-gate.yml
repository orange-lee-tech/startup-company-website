name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Strict typecheck
        run: npm run typecheck

      - name: Build production export
        env:
          GITHUB_PAGES: ""
          NEXT_PUBLIC_SITE_BASE_PATH: ""
        run: npm run build

      - name: Verify export contract
        run: npm run verify:export

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser tests
        run: npm run test:e2e
