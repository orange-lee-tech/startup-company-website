name: One-time package identity refresh

on:
  push:
    branches:
      - four-stage-site-hardening-20260808
    paths:
      - .github/workflows/package-identity-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: four-stage-site-hardening-20260808

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Replace inherited template package identity
        run: |
          npm pkg set name=jiuchen-education-website
          npm install --package-lock-only

      - name: Commit manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: replace inherited template package identity"
          git push origin HEAD:four-stage-site-hardening-20260808
