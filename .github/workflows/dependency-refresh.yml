name: One-time dependency refresh

on:
  push:
    branches:
      - four-stage-site-hardening-20260808
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: four-stage-site-hardening-20260808

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh framework and lint dependencies
        run: |
          npm install next@16.3.0 eslint-config-next@16.3.0 --save-exact
          npm uninstall next-themes
          npm audit fix

      - name: Commit refreshed manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh framework dependencies and lockfile"
          git push origin HEAD:four-stage-site-hardening-20260808
